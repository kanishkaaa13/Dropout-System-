# ─────────────────────────────────────────────────────────────────────────────
# frontend/nginx.conf
# Nginx server block for the React SPA served inside the frontend container.
#
# Note: This is the inner nginx config (port 80 inside the container).
#       The outer gateway nginx (nginx/ directory) proxies to this container.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    image/svg+xml application/wasm;

    # ── Cache static assets aggressively (Vite hashes filenames) ─────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # ── React Router fallback ─────────────────────────────────────────────────
    # All routes that are not real files are served index.html so that
    # client-side routing works correctly after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
