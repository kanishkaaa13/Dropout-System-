# alembic.ini — Alembic configuration for JEE Dropout Prediction System
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = migrations

# Template for revision file naming: YYYY-MM-DD_<revid>_<slug>.py
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Truncate long slugs
truncate_slug_length = 40

# Version path separator (os, :, space, newline)
version_path_separator = os

# SQLAlchemy URL — overridden by env.py reading from settings
# Leave as empty string; env.py sets it at runtime from DATABASE_URL
sqlalchemy.url =

[post_write_hooks]
# Optional: run black on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
