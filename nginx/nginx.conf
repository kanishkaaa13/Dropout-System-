# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf
# Gateway reverse proxy: routes all external traffic to the correct service.
#
# /api/v1/*  →  backend:8000   (FastAPI)
# /          →  frontend:80    (React SPA)
#
# Designed to sit in front of the docker-compose stack.
# ─────────────────────────────────────────────────────────────────────────────

# Number of worker processes — 'auto' uses one per CPU core
worker_processes auto;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Allow large uploads (CSV student data, bulk imports)
    client_max_body_size 20M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        application/wasm;

    # ── Upstream backends ─────────────────────────────────────────────────────
    # Docker service names resolve to container IPs automatically.

    upstream backend_upstream {
        server backend:8000;
        # Add more servers here for horizontal scaling:
        # server backend2:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;   # catch-all — change to your domain in production

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"             always;
        add_header X-Content-Type-Options "nosniff"                always;
        add_header X-XSS-Protection       "1; mode=block"          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── FastAPI backend (/api/) ───────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;

            # Standard proxy headers so FastAPI sees the real client IP
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for streaming responses (PDF / Excel downloads)
            proxy_buffering           off;
            proxy_request_buffering   off;

            # Timeouts — increased for ML prediction calls
            proxy_connect_timeout  60s;
            proxy_read_timeout     120s;
            proxy_send_timeout     60s;
        }

        # ── FastAPI Swagger / health ──────────────────────────────────────────
        location ~ ^/(health|api/docs|api/redoc|api/openapi\.json) {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── React SPA (everything else) ───────────────────────────────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Pass through caching headers from the inner nginx
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── HTTPS redirect template (uncomment when SSL is configured) ─────────────
    # server {
    #     listen      80;
    #     server_name your-domain.com;
    #     return 301  https://$host$request_uri;
    # }
    #
    # server {
    #     listen              443 ssl http2;
    #     server_name         your-domain.com;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ...
    # }
}
